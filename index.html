<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sci-Hunter: โหมด AR กล่องปริศนา</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        .ui-layer { z-index: 9999; position: absolute; }
        .pointer-events-auto { pointer-events: auto; }
        .modal-bg { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); }
    </style>
</head>
<body style="margin: 0; overflow: hidden;" class="font-sans text-white">

    <div id="loginScreen" class="ui-layer inset-0 bg-gray-900 w-full h-full flex flex-col justify-center items-center px-6">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center pointer-events-auto">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Sci-Hunter AR</h1>
            <p class="text-gray-600 mb-6">ภารกิจตามล่ากล่องปริศนา</p>
            
            <input type="text" id="studentIdInput" placeholder="กรอกรหัสนักเรียน" 
                   class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 text-gray-800 text-center mb-4">
                   
            <button id="loginBtn" onclick="loginUser()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700">
                เข้าสู่ระบบ / เปิดกล้อง
            </button>
            <p id="loginError" class="text-red-500 mt-3 text-sm hidden"></p>
        </div>
    </div>

    <div id="gameUI" class="hidden ui-layer top-4 left-0 w-full px-4 flex justify-between items-start pointer-events-none">
        <div class="bg-white/90 text-gray-800 p-3 rounded-xl shadow-lg w-full border-l-4 border-blue-500 pointer-events-auto">
            <h1 class="font-bold text-lg">นักวิจัย: <span id="playerNameDisplay" class="text-blue-600"></span></h1>
            <p id="statusText" class="text-sm text-gray-600 mt-1">หันกล้องหา "กล่องปริศนา" แล้วแตะเพื่อเปิด!</p>
        </div>
    </div>

    <div id="questionModal" class="hidden ui-layer inset-0 modal-bg w-full h-full flex flex-col justify-center items-center px-4 pointer-events-auto">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md text-center border-t-8 border-indigo-500 relative">
            <h2 id="qTitle" class="text-2xl font-bold text-indigo-600 mb-2">พบไอเทม!</h2>
            
            <img id="qItemIcon" src="" crossorigin="anonymous" class="w-24 h-24 mx-auto mb-4 drop-shadow-lg animate-bounce object-contain">
            
            <p id="qText" class="text-gray-700 text-lg mb-6 font-medium">คำถามจะปรากฏที่นี่?</p>
            
            <div class="space-y-3">
                <button onclick="checkAnswer(1)" id="btnChoice1" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-3 px-4 border border-blue-300 rounded-xl transition"></button>
                <button onclick="checkAnswer(2)" id="btnChoice2" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-3 px-4 border border-blue-300 rounded-xl transition"></button>
                <button onclick="checkAnswer(3)" id="btnChoice3" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold py-3 px-4 border border-blue-300 rounded-xl transition"></button>
            </div>
            
            <button onclick="closeQuestionModal()" class="mt-6 text-gray-400 hover:text-gray-600 underline text-sm">
                หนีไปตั้งหลักก่อน
            </button>
        </div>
    </div>

    <div id="ar-container" style="display: none;">
        <a-scene
            vr-mode-ui="enabled: false"
            embedded
            arjs="sourceType: webcam; debugUIEnabled: false;"
            cursor="rayOrigin: mouse"
            raycaster="objects: .clickable">
            
            <a-camera gps-camera rotation-reader>
                <a-cursor color="#3b82f6" scale="1.5 1.5 1.5"></a-cursor>
            </a-camera>
        </a-scene>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwuvzSAwabFi8DlT_MFzAq0rrWT_dMAOCEbJSJB_OsfZPqn9IL1L6Zy2E1JNjkIh9rxkg/exec"; 

        let currentTargetEntity = null;
        let currentCorrectAnswer = null;

        function loginUser() {
            const studentId = document.getElementById('studentIdInput').value.trim();
            const errorText = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!studentId) {
                showError("กรุณากรอกรหัสนักเรียน");
                return;
            }

            errorText.classList.add('hidden');
            loginBtn.innerText = "กำลังเชื่อมต่อ...";
            loginBtn.disabled = true;
            
            fetch(`${API_URL}?action=login&id=${studentId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        startGame(data.name);
                    } else {
                        showError(data.message);
                        loginBtn.innerText = "เข้าสู่ระบบ / เปิดกล้อง";
                        loginBtn.disabled = false;
                    }
                })
                .catch(err => {
                    showError("เกิดข้อผิดพลาดในการเชื่อมต่อ");
                    loginBtn.innerText = "เข้าสู่ระบบ / เปิดกล้อง";
                    loginBtn.disabled = false;
                });
        }

        function showError(msg) {
            const errorText = document.getElementById('loginError');
            errorText.innerText = msg;
            errorText.classList.remove('hidden');
        }

        function startGame(playerName) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('gameUI').classList.remove('hidden');
            document.getElementById('ar-container').style.display = 'block';
            document.getElementById('playerNameDisplay').innerText = playerName;

            fetch(`${API_URL}?action=getItems`)
                .then(res => res.json())
                .then(data => {
                    const scene = document.querySelector('a-scene');
                    
                    // 🌟 1. แยกเก็บ "พิกัด (Locations)" เอาไว้ไม่ให้ขยับ
                    const locations = data.map(d => ({ lat: d.lat, lng: d.lng }));
                    
                    // 🌟 2. สับไพ่ "ข้อมูลไอเทม (Items)" ให้เรียงแบบสุ่ม (Shuffle)
                    const shuffledItems = [...data].sort(() => Math.random() - 0.5);
                    
                    // 🌟 3. วนลูปสร้างกล่องตามจำนวนพิกัด
                    locations.forEach((loc, index) => {
                        const randomItem = shuffledItems[index]; // หยิบไอเทมที่สุ่มแล้วมาใส่กล่อง
                        
                        const entity = document.createElement('a-image');
                        
                        // 🟢 อ้างอิงรูปกล่องปริศนาจากใน GitHub ของเราเอง (ป้องกันการโดนบล็อก CORS)
                        // รบกวนคุณครูอัปโหลดรูปชื่อ box.png ไว้ใน GitHub ด้วยนะครับ
                        entity.setAttribute('src', 'box.png'); 
                        
                        entity.setAttribute('gps-entity-place', `latitude: ${loc.lat}; longitude: ${loc.lng};`);
                        entity.setAttribute('scale', '10 10 10');
                        entity.setAttribute('look-at', '[gps-camera]');
                        entity.classList.add('clickable');
                        
                        // เมื่อคลิกที่กล่องปริศนา
                        entity.addEventListener('click', function() {
                            // ส่งข้อมูลไอเทมที่ถูกสุ่มไว้ ไปเปิดแสดงผล
                            openQuestionModal(randomItem, entity);
                        });

                        scene.appendChild(entity);
                    });
                });
        }

        function openQuestionModal(itemData, entityElement) {
            currentTargetEntity = entityElement;
            currentCorrectAnswer = itemData.answer;

            document.getElementById('qTitle').innerText = `เปิดกล่องพบ: ${itemData.name}`;
            
            // 🟢 ให้รูปไอเทมของจริง โผล่ขึ้นมาตอนกล่องแตก
            document.getElementById('qItemIcon').src = itemData.iconUrl; 
            
            document.getElementById('qText').innerText = itemData.question;
            document.getElementById('btnChoice1').innerText = itemData.choice1;
            document.getElementById('btnChoice2').innerText = itemData.choice2;
            document.getElementById('btnChoice3').innerText = itemData.choice3;

            document.getElementById('questionModal').classList.remove('hidden');
        }

        function closeQuestionModal() {
            document.getElementById('questionModal').classList.add('hidden');
            currentTargetEntity = null;
        }

        function checkAnswer(selectedChoice) {
            if (selectedChoice == currentCorrectAnswer) {
                alert("🎉 ยินดีด้วย! ตอบถูก จับไอเทมได้สำเร็จ");
                if (currentTargetEntity && currentTargetEntity.parentNode) {
                    currentTargetEntity.parentNode.removeChild(currentTargetEntity);
                }
                closeQuestionModal();
            } else {
                alert("❌ ยังไม่ถูกต้องนะ ลองคิดดูดีๆ อีกครั้ง!");
            }
        }
    </script>
</body>
</html>
